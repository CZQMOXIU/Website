<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棋类乐园 - 对局</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    min-height: 100vh; background: #1e293b; color: #e2e8f0;
    display: flex; flex-direction: column; align-items: center; padding: 16px;
  }
  .topbar {
    width: 100%; max-width: 760px; display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
  }
  .topbar h2 { font-size: 18px; color: #90caf9; }
  .topbar .btns { display: flex; gap: 8px; }
  .btn {
    background: rgba(255,255,255,0.1); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.15);
    padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 13px; font-family: inherit;
    transition: all .2s;
  }
  .btn:hover { background: rgba(100,181,246,0.2); }
  .btn.primary { background: #3949ab; border-color: #3949ab; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .status {
    width: 100%; max-width: 760px; background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    padding: 10px 18px; margin-bottom: 14px; font-size: 14px; text-align: center;
  }
  .status b { color: #ffd54f; }
  .board-wrap {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 14px; max-width: 100%; overflow: auto;
  }
  canvas { display: block; }
  .info {
    width: 100%; max-width: 760px; margin-top: 14px; text-align: center;
    font-size: 13px; color: #94a3b8; min-height: 20px;
  }
  .flying-panel {
    display: flex; align-items: center; gap: 14px; justify-content: center; margin-top: 10px;
  }
  .dice {
    width: 64px; height: 64px; background: linear-gradient(135deg, #ffd54f, #ffb300);
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: bold; color: #5d4037; box-shadow: 0 4px 14px rgba(255,179,0,0.4);
  }
  .dice.dim { opacity: 0.3; }
  .overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.92);
    display: none; align-items: center; justify-content: center; z-index: 100; flex-direction: column; gap: 18px;
  }
  .overlay.show { display: flex; }
  .overlay h1 { font-size: 32px; color: #ffd54f; }
  .overlay .sub { color: #94a3b8; font-size: 15px; }
  @media (max-width: 600px) {
    .topbar { justify-content: center; }
    body { padding: 8px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <h2 id="gameTitle">对局中</h2>
  <div class="btns">
    <button class="btn" id="btnUndo" onclick="undo()" style="display:none">↩️ 悔棋(<span id="undoLeft">3</span>)</button>
    <button class="btn" onclick="location.href='lobby.html'">🏠 返回大厅</button>
  </div>
</div>
<div class="status" id="status">加载中…</div>
<div class="board-wrap"><canvas id="board"></canvas></div>
<div class="flying-panel" id="flyingPanel" style="display:none">
  <button class="btn primary" id="btnRoll" onclick="rollDice()">🎲 掷骰子</button>
  <div class="dice dim" id="diceBox">?</div>
</div>
<div class="info" id="info"></div>
<div class="overlay" id="overlay">
  <h1 id="overTitle">对局结束</h1>
  <div class="sub" id="overSub"></div>
  <button class="btn primary" onclick="location.href='lobby.html'">返回大厅</button>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const GAME_NAMES = { gobang: '五子棋', xiangqi: '中国象棋', chess: '国际象棋', go: '围棋', flying: '飞行棋' };
let user = null;
let room = null;
let state = null;
let myColor = 0;
let undoLeft = 3;
let socket = null;

// 棋盘尺寸
const CELL = 42, MARGIN = 34;

// ============ 渲染 ============
function draw() {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const game = room.game;

  if (game === 'flying') {
    drawFlying(ctx, canvas);
  } else if (game === 'gobang') {
    const size = 15;
    canvas.width = MARGIN * 2 + (size - 1) * CELL;
    canvas.height = MARGIN * 2 + (size - 1) * CELL;
    ctx.fillStyle = '#d7a95c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#6d4c2f';
    ctx.lineWidth = 1;
    for (let i = 0; i < size; i++) {
      ctx.beginPath(); ctx.moveTo(MARGIN, MARGIN + i * CELL); ctx.lineTo(MARGIN + (size-1)*CELL, MARGIN + i * CELL); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(MARGIN + i * CELL, MARGIN); ctx.lineTo(MARGIN + i * CELL, MARGIN + (size-1)*CELL); ctx.stroke();
    }
    const stars = [[3,3],[3,11],[7,7],[11,3],[11,11]];
    stars.forEach(([x,y]) => {
      ctx.beginPath(); ctx.arc(MARGIN + x*CELL, MARGIN + y*CELL, 3, 0, Math.PI*2); ctx.fillStyle = '#6d4c2f'; ctx.fill();
    });
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      if (state.board[y][x] === 0) continue;
      ctx.beginPath();
      ctx.arc(MARGIN + x*CELL, MARGIN + y*CELL, CELL * 0.42, 0, Math.PI*2);
      ctx.fillStyle = state.board[y][x] === 1 ? '#111' : '#fff';
      ctx.fill();
      if (state.board[y][x] === 2) { ctx.strokeStyle = '#333'; ctx.stroke(); }
    }
    if (state.lastMove) {
      ctx.strokeStyle = '#f44336';
      ctx.lineWidth = 2;
      ctx.strokeRect(MARGIN + state.lastMove.x*CELL - CELL*0.38, MARGIN + state.lastMove.y*CELL - CELL*0.38, CELL*0.76, CELL*0.76);
      ctx.lineWidth = 1;
    }
    canvas.onclick = e => {
      if (state.turn !== myColor || room.gameOver) return;
      const rect = canvas.getBoundingClientRect();
      const x = Math.round((e.clientX - rect.left) * canvas.width / rect.width - MARGIN) / CELL;
      const y = Math.round((e.clientY - rect.top) * canvas.height / rect.height - MARGIN) / CELL;
      if (x < 0 || x >= 15 || y < 0 || y >= 15) return;
      socket.emit('place', { roomId: room.roomId, x: Math.round(x), y: Math.round(y) });
    };
  } else if (game === 'xiangqi') {
    canvas.width = MARGIN * 2 + 8 * CELL;
    canvas.height = MARGIN * 2 + 9 * CELL;
    ctx.fillStyle = '#e8c97a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 1.5;
    for (let i = 0; i <= 8; i++) {
      ctx.beginPath(); ctx.moveTo(MARGIN, MARGIN + i * CELL); ctx.lineTo(MARGIN + 8*CELL, MARGIN + i * CELL); ctx.stroke();
    }
    for (let i = 0; i <= 9; i++) {
      ctx.beginPath(); ctx.moveTo(MARGIN + i * CELL, MARGIN); ctx.lineTo(MARGIN + i * CELL, MARGIN + 9*CELL); ctx.stroke();
    }
    [[[3,0],[5,2]],[[5,0],[3,2]],[[3,7],[5,9]],[[5,7],[3,9]]].forEach(([a,b]) => {
      ctx.beginPath();
      ctx.moveTo(MARGIN + a[0]*CELL, MARGIN + a[1]*CELL);
      ctx.lineTo(MARGIN + b[0]*CELL, MARGIN + b[1]*CELL);
      ctx.stroke();
    });
    const red = 'rgba(198,40,40,0.9)', black = 'rgba(33,33,33,0.9)';
    const pieces = { 1:'炮', 2:'车', 3:'马', 4:'象', 5:'士', 6:'帅', 7:'兵', 11:'炮', 12:'车', 13:'马', 14:'相', 15:'仕', 16:'将', 17:'卒' };
    for (let y = 0; y < 10; y++) for (let x = 0; x < 9; x++) {
      const v = state.board[y][x];
      if (v === 0) continue;
      const isRed = v < 11;
      ctx.beginPath();
      ctx.arc(MARGIN + x*CELL, MARGIN + y*CELL, CELL*0.42, 0, Math.PI*2);
      ctx.fillStyle = '#f8e5b8';
      ctx.fill();
      ctx.strokeStyle = isRed ? '#c62828' : '#263238';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = isRed ? '#c62828' : '#263238';
      ctx.font = `bold ${CELL*0.44}px "Microsoft YaHei"`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(pieces[v], MARGIN + x*CELL, MARGIN + y*CELL + 2);
    }
    canvas.onclick = e => {
      if (state.turn !== myColor || room.gameOver) return;
      const rect = canvas.getBoundingClientRect();
      const x = Math.round((e.clientX - rect.left) * canvas.width / rect.width - MARGIN) / CELL;
      const y = Math.round((e.clientY - rect.top) * canvas.height / rect.height - MARGIN) / CELL;
      if (x < 0 || x >= 9 || y < 0 || y >= 10) return;
      const fx = Math.round(x), fy = Math.round(y);
      if (mySel) {
        socket.emit('place', { roomId: room.roomId, fx: mySel[0], fy: mySel[1], tx: fx, ty: fy });
        mySel = null;
      } else {
        if (state.board[fy][fx] !== 0) {
          const mine = (v, c) => c === 1 ? v >= 1 && v <= 7 : v >= 11 && v <= 17;
          if (mine(state.board[fy][fx], myColor + 1)) mySel = [fx, fy];
        }
      }
    };
  } else if (game === 'chess') {
    canvas.width = MARGIN * 2 + 7 * CELL;
    canvas.height = MARGIN * 2 + 7 * CELL;
    ctx.fillStyle = '#f0e6d2';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 1.5;
    for (let i = 0; i <= 8; i++) {
      ctx.beginPath(); ctx.moveTo(MARGIN, MARGIN + i * CELL); ctx.lineTo(MARGIN + 7*CELL, MARGIN + i * CELL); ctx.stroke();
    }
    for (let i = 0; i <= 8; i++) {
      ctx.beginPath(); ctx.moveTo(MARGIN + i * CELL, MARGIN); ctx.lineTo(MARGIN + i * CELL, MARGIN + 7*CELL); ctx.stroke();
    }
    const pieces = { 1:'♙', 2:'♖', 3:'♘', 4:'♗', 5:'♕', 6:'♔', 11:'♟', 12:'♜', 13:'♞', 14:'♝', 15:'♛', 16:'♚' };
    const colors = { 1:'#f5f5f5', 2:'#f5f5f5', 3:'#f5f5f5', 4:'#f5f5f5', 5:'#f5f5f5', 6:'#f5f5f5', 11:'#1a1a1a', 12:'#1a1a1a', 13:'#1a1a1a', 14:'#1a1a1a', 15:'#1a1a1a', 16:'#1a1a1a' };
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
      const v = state.board[y][x];
      if (v === 0) continue;
      ctx.fillStyle = colors[v];
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(MARGIN + x*CELL, MARGIN + y*CELL, CELL*0.38, 0, Math.PI*2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = v < 11 ? '#c62828' : '#1a1a1a';
      ctx.font = `${CELL*0.5}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(pieces[v], MARGIN + x*CELL, MARGIN + y*CELL + 3);
    }
    canvas.onclick = e => {
      if (state.turn !== myColor || room.gameOver) return;
      const rect = canvas.getBoundingClientRect();
      const x = Math.round((e.clientX - rect.left) * canvas.width / rect.width - MARGIN) / CELL;
      const y = Math.round((e.clientY - rect.top) * canvas.height / rect.height - MARGIN) / CELL;
      if (x < 0 || x >= 8 || y < 0 || y >= 8) return;
      const fx = Math.round(x), fy = Math.round(y);
      if (mySel) {
        socket.emit('place', { roomId: room.roomId, fx: mySel[0], fy: mySel[1], tx: fx, ty: fy });
        mySel = null;
      } else {
        if (state.board[fy][fx] !== 0) {
          const mine = (v, c) => c === 1 ? v >= 1 && v <= 6 : v >= 11 && v <= 16;
          if (mine(state.board[fy][fx], myColor + 1)) mySel = [fx, fy];
        }
      }
    };
  } else if (game === 'go') {
    const N = state.board.length;
    canvas.width = MARGIN * 2 + (N - 1) * CELL;
    canvas.height = MARGIN * 2 + (N - 1) * CELL;
    ctx.fillStyle = '#d7a95c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#6d4c2f';
    ctx.lineWidth = 1;
    for (let i = 0; i < N; i++) {
      ctx.beginPath(); ctx.moveTo(MARGIN, MARGIN + i * CELL); ctx.lineTo(MARGIN + (N-1)*CELL, MARGIN + i * CELL); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(MARGIN + i * CELL, MARGIN); ctx.lineTo(MARGIN + i * CELL, MARGIN + (N-1)*CELL); ctx.stroke();
    }
    const stars = [[3,3],[3,9],[6,6],[9,3],[9,9]];
    stars.forEach(([x,y]) => {
      ctx.beginPath(); ctx.arc(MARGIN + x*CELL, MARGIN + y*CELL, 3, 0, Math.PI*2); ctx.fillStyle = '#6d4c2f'; ctx.fill();
    });
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      if (state.board[y][x] === 0) continue;
      ctx.beginPath();
      ctx.arc(MARGIN + x*CELL, MARGIN + y*CELL, CELL*0.42, 0, Math.PI*2);
      ctx.fillStyle = state.board[y][x] === 1 ? '#111' : '#fff';
      ctx.fill();
      if (state.board[y][x] === 2) { ctx.strokeStyle = '#333'; ctx.stroke(); }
    }
    canvas.onclick = e => {
      if (state.turn !== myColor || room.gameOver) return;
      const rect = canvas.getBoundingClientRect();
      const x = Math.round((e.clientX - rect.left) * canvas.width / rect.width - MARGIN) / CELL;
      const y = Math.round((e.clientY - rect.top) * canvas.height / rect.height - MARGIN) / CELL;
      if (x < 0 || x >= N || y < 0 || y >= N) return;
      socket.emit('place', { roomId: room.roomId, x: Math.round(x), y: Math.round(y) });
    };
  }
}

// ============ 飞行棋 ============
const FLY_TRACK = 52;
function drawFlying(ctx, canvas) {
  // 12x11 网格跑道 (52格)
  canvas.width = 12 * CELL;
  canvas.height = 11 * CELL;
  ctx.fillStyle = '#16324a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // 跑道轨迹 (顺时针)
  const path = [];
  for (let x = 0; x < 10; x++) path.push([x, 0]);
  for (let y = 0; y < 8; y++) path.push([10, y]);
  for (let x = 10; x > 0; x--) path.push([x, 8]);
  for (let y = 8; y > 0; y--) path.push([0, y]);
  // 画格
  for (let i = 0; i < FLY_TRACK; i++) {
    const [px, py] = path[i % path.length];
    ctx.fillStyle = (Math.floor(i / 13) % 2 === 0) ? '#1d4a6b' : '#22557a';
    ctx.fillRect(px * CELL + 2, py * CELL + 2, CELL - 4, CELL - 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.strokeRect(px * CELL + 2, py * CELL + 2, CELL - 4, CELL - 4);
  }
  // 中心区域
  ctx.fillStyle = '#123046';
  ctx.fillRect(2 * CELL, 1 * CELL, 8 * CELL, 7 * CELL);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.font = 'bold 18px "Microsoft YaHei"';
  ctx.textAlign = 'center';
  ctx.fillText('飞行棋', 6 * CELL, 3.2 * CELL);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '12px "Microsoft YaHei"';
  ctx.fillText('掷6起飞 · 4机到终点获胜', 6 * CELL, 4.5 * CELL);
  // 玩家飞机
  state.players.forEach((p, pi) => {
    const off = p.pos.filter(pos => pos === -1 && !p.finished.some((f, i) => f && p.pos[i] === -1)).length;
    // 绘制在跑道上的飞机
    for (let k = 0; k < 4; k++) {
      const pos = p.pos[k];
      if (pos === -1) continue;
      const [px, py] = path[pos % path.length];
      ctx.beginPath();
      ctx.arc(px * CELL + CELL / 2, py * CELL + CELL / 2, 8 + k * 2, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    // 停机坪: 4个角落, 每玩家一组(用名称标识)
    const corners = [[0.5, 9.5], [10.5, 0.5], [0.5, 0.5], [10.5, 9.5]];
    const [cx, cy] = corners[pi % 4];
    ctx.fillStyle = p.color;
    ctx.font = 'bold 12px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, cx * CELL, cy * CELL + 4);
    const parked = [0, 1, 2, 3].filter(k => p.pos[k] === -1 && !p.finished[k]);
    parked.forEach((k, idx) => {
      ctx.beginPath();
      ctx.arc(cx * CELL - 20 + idx * 14, cy * CELL + 14, 5, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
    });
    const fin = p.finished.filter(Boolean).length;
    if (fin > 0) ctx.fillText('✓'.repeat(fin), cx * CELL, cy * CELL + 26);
  });
  // 当前掷骰指示
  const dice = document.getElementById('diceBox');
  if (state.dice) {
    dice.textContent = state.dice;
    dice.classList.remove('dim');
  } else {
    dice.textContent = '?';
    dice.classList.add('dim');
  }
}

// ============ 交互 ============
let mySel = null;

function rollDice() {
  if (!room || room.gameOver || state.turn !== myColor) return;
  socket.emit('place', { roomId: room.roomId, roll: true });
}

function undo() {
  if (!room || room.gameOver || room.game !== 'gobang') return;
  socket.emit('undo', { roomId: room.roomId });
}

function updateUI() {
  const isMyTurn = state.turn === myColor && !room.gameOver;
  const turnName = state.players ? (state.players[state.turn] ? state.players[state.turn].name : '对方') : '对方';
  const statusEl = document.getElementById('status');
  const infoEl = document.getElementById('info');
  const game = room.game;

  if (game === 'flying') {
    document.getElementById('flyingPanel').style.display = 'flex';
    statusEl.innerHTML = isMyTurn ? '<b>轮到你掷骰子！</b>' : '等待 ' + turnName + ' 掷骰子…';
    document.getElementById('btnRoll').disabled = !isMyTurn;
  } else {
    document.getElementById('flyingPanel').style.display = 'none';
    statusEl.innerHTML = isMyTurn ? '<b>轮到你落子</b>' : '等待 ' + turnName + '…';
  }
  if (game === 'gobang') {
    infoEl.innerHTML = `<b>${GAME_NAMES[game]}</b> · 你执${myColor === 0 ? '黑' : '白'} · 手数 <b>${state.movesCount}</b> · 悔棋剩余 <b>${undoLeft}</b>`;
    document.getElementById('btnUndo').style.display = 'inline-block';
    document.getElementById('undoLeft').textContent = undoLeft;
  } else if (game === 'go') {
    infoEl.innerHTML = `<b>${GAME_NAMES[game]}</b> · 你执${myColor === 0 ? '黑' : '白'} · 双方连续虚手2次终局 · 手数 <b>${state.movesCount}</b>`;
  } else if (game === 'flying') {
    const d = state.dice;
    infoEl.innerHTML = `<b>${GAME_NAMES[game]}</b> · 点「🎲 掷骰子」自动飞行 · 掷到6起飞并可再掷 · 谁先4机到终点获胜` + (d ? ` · 本次掷出 <b style="font-size:18px;color:#ffd700">${d}</b>` : '');
  } else {
    infoEl.innerHTML = `<b>${GAME_NAMES[game]}</b> · 你执${myColor === 0 ? '先手' : '后手'} · 手数 <b>${state.movesCount}</b>`;
  }
}

// ============ Socket ============
function connect() {
  user = JSON.parse(sessionStorage.getItem('user'));
  room = JSON.parse(sessionStorage.getItem('room'));
  if (!user || !room) { location.href = 'lobby.html'; return; }
  myColor = room.color;
  document.getElementById('gameTitle').textContent = GAME_NAMES[room.game] + ' · 对手: ' + room.opponentName;
  document.getElementById('gameTitle').title = '对手: ' + room.opponentName;
  socket = io();
  socket.emit('loginSocket', user);
  socket.emit('joinRoom', { roomId: room.roomId, user });
  socket.on('gameState', d => {
    state = d.state;
    room.gameOver = d.gameOver;
    draw();
    updateUI();
  });
  socket.on('gameOver', d => {
    room.gameOver = true;
    const ov = document.getElementById('overlay');
    document.getElementById('overTitle').textContent = d.winnerName === user.username ? '🎉 你赢了！' : '对局结束';
    document.getElementById('overSub').textContent = '获胜者: ' + d.winnerName + ' · ' + (d.reason || '');
    ov.classList.add('show');
    if (state) { draw(); updateUI(); }
  });
  socket.on('roomEnd', () => {
    document.getElementById('overlay').classList.add('show');
  });
  socket.on('roomNotFound', () => {
    document.getElementById('status').innerHTML = '<b style="color:#ef5350">对局不存在或已结束</b>';
    setTimeout(() => location.href = 'lobby.html', 1500);
  });
  socket.on('disconnect', () => {
    document.getElementById('status').innerHTML = '<b style="color:#ffd54f">连接断开，重连中…</b>';
    setTimeout(() => { if (!socket.connected) socket.connect(); }, 2000);
  });
}

connect();
</script>
</body>
</html>
