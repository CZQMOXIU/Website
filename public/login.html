<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棋类乐园 - 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1a237e 0%, #283593 40%, #0d47a1 100%);
    overflow: hidden;
  }
  .bg-shapes { position: fixed; inset: 0; pointer-events: none; }
  .bg-shapes div {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 70%);
    animation: float 12s infinite ease-in-out;
  }
  .bg-shapes div:nth-child(1) { width: 300px; height: 300px; top: -80px; left: -80px; }
  .bg-shapes div:nth-child(2) { width: 200px; height: 200px; bottom: -60px; right: -40px; animation-delay: -4s; }
  .bg-shapes div:nth-child(3) { width: 150px; height: 150px; top: 40%; right: 15%; animation-delay: -8s; }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-30px) scale(1.05); }
  }
  .card {
    width: 400px; max-width: 92vw;
    background: rgba(255,255,255,0.97);
    border-radius: 20px;
    padding: 40px 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    position: relative; z-index: 1;
  }
  .logo { text-align: center; margin-bottom: 28px; }
  .logo .icon { font-size: 52px; display: block; margin-bottom: 8px; }
  .logo h1 {
    font-size: 28px; color: #1a237e;
    background: linear-gradient(135deg, #1a237e, #3949ab);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .logo p { color: #78909c; font-size: 13px; margin-top: 6px; }
  .tabs { display: flex; background: #e8eaf6; border-radius: 12px; padding: 4px; margin-bottom: 22px; }
  .tabs button {
    flex: 1; padding: 10px; border: none; background: transparent;
    border-radius: 10px; font-size: 15px; cursor: pointer; color: #546e7a;
    transition: all .25s; font-family: inherit;
  }
  .tabs button.active { background: #3949ab; color: #fff; box-shadow: 0 4px 12px rgba(57,73,171,0.3); }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; color: #546e7a; margin-bottom: 6px; }
  .form-group input {
    width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 10px;
    font-size: 15px; transition: border-color .2s; outline: none; font-family: inherit;
  }
  .form-group input:focus { border-color: #3949ab; }
  .btn-primary {
    width: 100%; padding: 13px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #3949ab, #5c6bc0); color: #fff;
    font-size: 16px; font-weight: bold; cursor: pointer;
    transition: transform .15s, box-shadow .2s; font-family: inherit;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(57,73,171,0.35); }
  .msg { text-align: center; font-size: 14px; margin-top: 14px; min-height: 20px; }
  .msg.err { color: #e53935; }
  .msg.ok { color: #43a047; }
  .footer { text-align: center; margin-top: 20px; color: #b0bec5; font-size: 12px; }
</style>
</head>
<body>
<div class="bg-shapes"><div></div><div></div><div></div></div>
<div class="card">
  <div class="logo">
    <span class="icon">♟️</span>
    <h1>棋类乐园</h1>
    <p>五子棋 · 中国象棋 · 国际象棋 · 围棋 · 飞行棋</p>
  </div>
  <div class="tabs">
    <button id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
    <button id="tabReg" onclick="switchTab('reg')">注册</button>
  </div>
  <div id="loginForm">
    <div class="form-group"><label>用户名</label><input id="loginUser" placeholder="请输入用户名" autocomplete="username"></div>
    <div class="form-group"><label>密码</label><input id="loginPass" type="password" placeholder="请输入密码" autocomplete="current-password"></div>
    <button class="btn-primary" onclick="doLogin()">登 录</button>
  </div>
  <div id="regForm" style="display:none">
    <div class="form-group"><label>用户名</label><input id="regUser" placeholder="3-16个字符" autocomplete="off"></div>
    <div class="form-group"><label>密码</label><input id="regPass" type="password" placeholder="至少6位" autocomplete="new-password"></div>
    <div class="form-group"><label>确认密码</label><input id="regPass2" type="password" placeholder="再次输入密码" autocomplete="new-password"></div>
    <button class="btn-primary" onclick="doReg()">注册并登录</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="footer">账号密码加密传输存储 · Base64 + AES + DES</div>
</div>
<script>
function setMsg(t, type) {
  const m = document.getElementById('msg');
  m.textContent = t;
  m.className = 'msg ' + (type || '');
}
function switchTab(t) {
  document.getElementById('tabLogin').classList.toggle('active', t === 'login');
  document.getElementById('tabReg').classList.toggle('active', t === 'reg');
  document.getElementById('loginForm').style.display = t === 'login' ? 'block' : 'none';
  document.getElementById('regForm').style.display = t === 'reg' ? 'block' : 'none';
  setMsg('');
}
function b64(s) { return btoa(unescape(encodeURIComponent(s))); }
function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!username || !password) return setMsg('请输入用户名和密码', 'err');
  fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password: b64(password) }) })
    .then(r => r.json()).then(d => {
      if (d.code !== 0) return setMsg(d.msg, 'err');
      sessionStorage.setItem('user', JSON.stringify(d.data));
      location.href = 'lobby.html';
    }).catch(() => setMsg('网络错误，请确认服务器已启动', 'err'));
}
function doReg() {
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  const password2 = document.getElementById('regPass2').value;
  if (!username || !password) return setMsg('请填写用户名和密码', 'err');
  if (password.length < 6) return setMsg('密码至少6位', 'err');
  if (password !== password2) return setMsg('两次密码不一致', 'err');
  fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password: b64(password) }) })
    .then(r => r.json()).then(d => {
      if (d.code !== 0) return setMsg(d.msg, 'err');
      return fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password: b64(password) }) });
    }).then(r => r.json()).then(d => {
      if (d.code !== 0) return setMsg('注册成功，请手动登录', 'ok');
      sessionStorage.setItem('user', JSON.stringify(d.data));
      location.href = 'lobby.html';
    }).catch(() => setMsg('网络错误，请确认服务器已启动', 'err'));
}
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('regPass2').addEventListener('keydown', e => { if (e.key === 'Enter') doReg(); });
</script>
</body>
</html>
